<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="60" y1="40" x2="452" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="230" r="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxA" x1="104" y1="110" x2="304" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="boxB" x1="208" y1="202" x2="408" y2="402" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <clipPath id="clipA">
      <rect x="104" y="110" width="200" height="200" rx="26"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="114" fill="#05080f"/>
  <rect x="14" y="14" width="484" height="484" rx="102" fill="url(#ring)"/>
  <rect x="34" y="34" width="444" height="444" rx="84" fill="#0a1222"/>
  <rect x="34" y="34" width="444" height="444" rx="84" fill="url(#glow)"/>
  <rect x="35.5" y="35.5" width="441" height="441" rx="82.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- Intersection = detected duplicate, tinted green (under strokes) -->
  <g clip-path="url(#clipA)">
    <rect x="208" y="202" width="200" height="200" rx="26" fill="#34d399" fill-opacity="0.55"/>
  </g>

  <!-- Duplicate box A (cyan) -->
  <rect x="104" y="110" width="200" height="200" rx="26" fill="#38bdf8" fill-opacity="0.13" stroke="url(#boxA)" stroke-width="22"/>
  <!-- Duplicate box B (amber→rose) -->
  <rect x="208" y="202" width="200" height="200" rx="26" fill="#fb7185" fill-opacity="0.13" stroke="url(#boxB)" stroke-width="22"/>

  <!-- Verified check -->
  <path d="m229 256 18 18 38-42" fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner handles -->
  <g fill="#f8fafc">
    <circle cx="104" cy="110" r="11.5"/><circle cx="304" cy="110" r="11.5"/>
    <circle cx="104" cy="310" r="11.5"/><circle cx="304" cy="310" r="11.5"/>
    <circle cx="208" cy="202" r="11.5"/><circle cx="408" cy="202" r="11.5"/>
    <circle cx="208" cy="402" r="11.5"/><circle cx="408" cy="402" r="11.5"/>
  </g>
</svg>
